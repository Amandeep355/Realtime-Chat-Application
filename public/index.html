<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>iChat — Realtime Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <script defer src="/socket.io/socket.io.js"></script>
  <script defer src="js/client.js"></script>
  <link rel="icon" href="data:,">
</head>
<body>
  <div class="noise-overlay" aria-hidden="true"></div>

  <nav>
    <span class="logo-text">iCHAT</span>
  </nav>

  <div class="user-info">
    <label for="nameInput">Your name</label>
    <input type="text" id="nameInput" placeholder="YOUR NAME" required autocomplete="name" />
    <label for="roomInput">Room</label>
    <input type="text" id="roomInput" placeholder="ROOM NAME" required autocomplete="off" />
    <button type="button" id="joinBtn" class="join-btn">Join room</button>
  </div>

  <div class="marquee-strip" aria-hidden="true">
    <div class="marquee-track">
      <span class="marquee-item">LIVE · CHAT · NOW · </span>
      <span class="marquee-item">LIVE · CHAT · NOW · </span>
    </div>
  </div>

  <div class="chat-section hidden" aria-label="Chat">
    <div class="messages-container" role="log" aria-live="polite" aria-label="Message history"></div>

    <div class="online-users" aria-label="Online users"></div>

    <div class="input-container">
      <form id="send-container" aria-label="Send message">
        <input type="text" class="message-input" placeholder="Type a message..." aria-label="Message" autocomplete="off" />
        <label for="fileInput" class="file-label" title="Attach file">📎</label>
        <input type="file" id="fileInput" aria-label="Attach file" />
        <button type="submit" class="send-button">Send</button>
      </form>
    </div>
  </div>
</body>
</html>
